services:
  underwriting-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: underwriting_engine_api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - REDIS_URL=redis://redis-cache:6379/0
      - USE_REDIS=true
    env_file:
      - .env
    depends_on:
      redis-cache:
        condition: service_healthy
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: underwriting_redis_cache
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
